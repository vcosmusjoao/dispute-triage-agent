[project]
name = "dispute-triage-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
# Without this, setuptools' auto-discovery finds eval/ (a real Python
# package, used for the offline eval harness) and frontend/ (not Python at
# all, but looks like a candidate directory to it) alongside app/, and
# refuses to guess which one is the actual package to ship. Only app/ is
# needed to run the deployed service.
include = ["app*"]
